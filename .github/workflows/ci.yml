name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests
        run: swift test
      - name: Universal macOS build and signature verification
        run: bash scripts/package.sh
      - name: Public source audit
        run: python3 scripts/audit_public.py
